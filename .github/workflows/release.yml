name: Build & Release XPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: API key from https://addons.mozilla.org/developers/addon/api/key/
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The manifest is packaged exactly as committed; the tag must match its version.
      - name: Determine version
        id: version
        run: |
          VERSION="$(jq -r .version extension/manifest.json)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error file=extension/manifest.json::Tag $GITHUB_REF_NAME does not match manifest version $VERSION. Bump the version in extension/manifest.json, commit, then tag v$VERSION."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Lint extension
        run: npx --yes web-ext@8 lint --source-dir extension

      - name: Build XPI
        run: |
          npx --yes web-ext@8 build --source-dir extension --artifacts-dir dist --overwrite-dest \
            --filename "chat-exporter-for-claude-${{ steps.version.outputs.version }}.zip"
          mv "dist/chat-exporter-for-claude-${{ steps.version.outputs.version }}.zip" \
             "dist/chat-exporter-for-claude-${{ steps.version.outputs.version }}.xpi"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: chat-exporter-for-claude-${{ steps.version.outputs.version }}
          path: dist/*.xpi

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.xpi \
            --title "Chat Exporter for Claude ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --notes "Firefox extension package (unsigned). See the README for installation instructions."

      # Submit the new version to addons.mozilla.org (listed). Skipped if the AMO secrets are not set.
      # Does not wait for Mozilla's review; the version goes live once it is approved.
      - name: Submit to addons.mozilla.org
        if: github.ref_type == 'tag' && env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: |
          npx --yes web-ext@8 sign --source-dir extension --artifacts-dir dist-amo \
            --channel listed --approval-timeout 0 \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
